<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADOFAI 自制谱加载器 v1.0.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部工具栏 -->
    <div class="toolbar">
      <h1>🔥❄️ ADOFAI 自制谱加载器</h1>

      <div class="toolbar-group">
        <button id="loadBtn" class="primary">📂 加载谱面</button>
        <input type="file" id="fileInput" accept=".adofai,.json">
        <button id="audioInputBtn" onclick="document.getElementById('audioInput').click()">🎵 音频</button>
        <input type="file" id="audioInput" accept="audio/*">
        <button id="saveBtn">💾 保存</button>
      </div>

      <div class="toolbar-group">
        <button id="playBtn">▶ 播放</button>
        <button id="pauseBtn" disabled>⏸ 暂停</button>
        <button id="stopBtn" disabled>⏹ 停止</button>
      </div>

      <div class="toolbar-group">
        <label class="checkbox">
          <input type="checkbox" id="autoplayToggle"> 自动播放
        </label>
        <label class="checkbox">
          <input type="checkbox" id="invincibleToggle"> 无敌模式
        </label>
        <select id="judgmentSelect">
          <option value="wide">宽判</option>
          <option value="standard" selected>标判</option>
          <option value="strict">严判</option>
        </select>
      </div>

      <div class="toolbar-group">
        <button id="zoomOutBtn">🔍-</button>
        <button id="zoomInBtn">🔍+</button>
      </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <div class="canvas-container">
        <canvas id="gameCanvas"></canvas>
      </div>

      <div class="sidebar">
        <div class="panel-section">
          <h3>瓷砖信息</h3>
          <div id="tileInfo"><div class="muted">未选中瓷砖</div></div>
        </div>

        <div class="panel-section">
          <h3>角度编辑</h3>
          <div class="angle-buttons" id="angleButtons"></div>
        </div>

        <div class="panel-section">
          <h3>编辑操作</h3>
          <div class="edit-actions">
            <button id="insertTileBtn">插入</button>
            <button id="nudgeLeftBtn">-15°</button>
            <button id="nudgeRightBtn">+15°</button>
            <button id="deleteTileBtn">删除</button>
          </div>
          <div class="hint" style="margin-top:8px">方向键选择 | Delete删除 | +/-微调 | Ctrl+C/V复制粘贴</div>
        </div>

        <div class="panel-section">
          <h3>统计</h3>
          <div id="statsPanel">
            <div>总数: 0</div>
            <div>击中: 0</div>
            <div>Miss: 0</div>
            <div>Combo: 0</div>
            <div>准确率: 0%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar"></div>
  </div>

  <!-- 脚本 -->
  <script src="js/parser.js"></script>
  <script src="js/level.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
