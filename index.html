<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Dance of Fire and Ice · 自制谱加载器 v1.3.0</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="logo-fire">●</span><span class="logo-ice">●</span>
        <span class="brand-text">A Dance of Fire and Ice</span>
        <span class="brand-sub">自制谱加载器</span>
        <span class="version">v1.3.0</span>
      </div>

      <div class="group">
        <button id="loadBtn" class="btn primary">加载谱面</button>
        <input type="file" id="fileInput" accept=".adofai,.json,.ogg,.mp3,.wav,.m4a,.flac,.aac,.webm" multiple>
        <button id="folderBtn" class="btn">文件夹</button>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
        <button id="demoBtn" class="btn">演示谱面</button>
        <button id="audioBtn" class="btn">音频</button>
        <input type="file" id="audioInput" accept="audio/*,.ogg,.mp3,.wav,.m4a,.flac">
        <button id="saveBtn" class="btn" disabled>保存</button>
        <span class="audio-status none" id="audioStatus">无音频</span>
      </div>

      <div class="group">
        <button id="playBtn" class="btn" disabled>播放</button>
        <button id="pauseBtn" class="btn" disabled>暂停</button>
        <button id="stopBtn" class="btn" disabled>停止</button>
        <button id="resetBtn" class="btn">重置</button>
      </div>

      <div class="group">
        <label class="switch"><input type="checkbox" id="autoplayToggle"><span>自动播放</span></label>
        <label class="switch"><input type="checkbox" id="invincibleToggle"><span>无敌模式</span></label>
        <select id="judgmentSelect" class="select" title="判定窗口">
          <option value="wide">宽判 ±150ms</option>
          <option value="standard" selected>标判 ±100ms</option>
          <option value="strict">严判 ±60ms</option>
        </select>
      </div>

      <div class="group offset-group">
        <span class="offset-label" title="修正音画不同步：正值表示音频延后，负值表示音频提前">音频偏移</span>
        <button id="offsetMinusBtn" class="btn icon" title="减少 1ms（按住 Shift 点击减 10ms）">−</button>
        <input id="offsetInput" class="num-input" type="number" inputmode="numeric" step="1"
               min="-5000" max="5000" value="0"
               title="修正音画不同步：正值表示音频延后，负值表示音频提前；范围 -5000 ~ +5000 ms，支持 1ms 精度输入">
        <span class="offset-unit">ms</span>
        <button id="offsetPlusBtn" class="btn icon" title="增加 1ms（按住 Shift 点击加 10ms）">+</button>
        <button id="offsetResetBtn" class="btn" title="重置音频偏移为 0">复位</button>
      </div>

      <div class="group right">
        <span class="mode-badge" id="modeBadge">标判</span>
        <label class="switch"><input type="checkbox" id="gridToggle" checked><span>网格</span></label>
        <button id="zoomOutBtn" class="btn icon" title="缩小">−</button>
        <button id="zoomInBtn" class="btn icon" title="放大">+</button>
      </div>
    </header>

    <main class="main">
      <section class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas"></canvas>
        <div class="hud">
          <div class="hud-track"><div class="hud-fill" id="progressFill"></div></div>
          <div class="hud-meta">
            <span id="timeText">0:00.0 / 0:00.0</span>
            <span class="hud-combo">连击 <b id="comboText">0</b></span>
            <span>准确率 <b id="accText">100.0%</b></span>
            <span id="clockText" class="clock">同步 —</span>
          </div>
        </div>
        <div class="drop-hint">松开以加载谱面</div>
      </section>

      <aside class="sidebar">
        <section class="card">
          <h3>瓷砖信息</h3>
          <div id="tilePanel"><div class="muted">未选中瓷砖 · 点击轨道上的方块选择</div></div>
          <div class="edit-grid">
            <button id="prevBtn" class="btn small">◀ 上一格</button>
            <button id="nextBtn" class="btn small">下一格 ▶</button>
            <button id="insertBtn" class="btn small">插入</button>
            <button id="deleteBtn" class="btn small">删除</button>
            <button id="nudgeLBtn" class="btn small">−15°</button>
            <button id="nudgeRBtn" class="btn small">+15°</button>
            <button id="copyBtn" class="btn small">复制</button>
            <button id="pasteBtn" class="btn small">粘贴</button>
          </div>
        </section>

        <section class="card">
          <h3>角度画笔</h3>
          <div class="brush" id="angleBrush"></div>
          <div class="hint">点击应用当前瓷砖 · Shift+点击在其后插入</div>
        </section>

        <section class="card">
          <h3>统计</h3>
          <div id="statsPanel" class="stats"></div>
        </section>

        <section class="card tips">
          <h3>快捷键</h3>
          <div class="hint">
            空格 播放/暂停（播放中为击打）<br>
            ← → 切换瓷砖 · Delete 删除 · +/- 微调<br>
            Ctrl+C / Ctrl+V 复制粘贴 · 滚轮缩放 · 拖拽平移
          </div>
        </section>
      </aside>
    </main>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/parser.js"></script>
  <script src="js/level.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
